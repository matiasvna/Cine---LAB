<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Catálogo Completo - CINEMAX</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tu CSS Personalizado -->
    <link rel="stylesheet" th:href="@{/css/peliculas.css}">
</head>
<body>
    <div class="catalog-container">
        
        <!-- Encabezado con título y botones principales -->
        <div class="d-flex justify-content-between align-items-center header-actions">
            <h2 class="brand-title m-0">Catálogo <span>Completo</span></h2>
            
            <div class="d-flex gap-3">
                <a th:href="@{/peliculas/new}" class="btn btn-primary">Nueva Película</a>
                <a th:href="@{/}" class="btn-back">Volver al Inicio</a>
            </div>
        </div>

        <!-- Tabla -->
        <div class="table-responsive">
            <table class="table table-custom">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Año</th>
                        <th>Director</th>
                        <th>Actores</th>
                        <th>Género</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="pelicula : ${peliculas}">
                        <td th:text="${pelicula.id}">1</td>
                        <td th:text="${pelicula.titulo}" style="font-weight: bold; color: #fff;">Título de Prueba</td>
                        
                        <!-- Columna de Año -->
                        <td th:text="${pelicula.año}">2026</td>
                        
                        <td th:text="${pelicula.director.nombre}">Director de Prueba</td>
                        
                        <!-- Columna de Actores separados por coma -->
                        <td>
                            <span th:each="actor, iterStat : ${pelicula.actores}" 
                                  th:text="${actor.nombre} + (!${iterStat.last} ? ', ' : '')">
                            </span>
                        </td>
                        
                        <td th:text="${pelicula.genero.titulo}">Género de Prueba</td>
                        <td>
                            <a th:href="@{/peliculas/editar/{id}(id=${pelicula.id})}" class="btn-edit">Editar</a>
                            <!-- Enlace corregido a 'delete' para que coincida con el controlador -->
                            <a th:href="@{/peliculas/delete/{id}(id=${pelicula.id})}" class="btn-delete">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</body>
</html>
