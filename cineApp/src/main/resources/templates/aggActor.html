<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Agregar Registro - CINEMAX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
    <div class="login-wrapper">
        <h2 class="brand-title" style="font-size: 1.6rem; color: #fafafa; margin-bottom: 1.5rem;">
            Nuevo <span>Actor</span>
        </h2>
        
        <div class="login-card">
            <div th:if="${error}" class="alert-custom alert-danger" th:text="${error}"></div>

            <form th:action="@{/actores}" th:object="${actor}" method="POST">
                <div class="form-group">
                    <label for="nombre" class="form-label">Nombre Completo</label>
                    <input type="text" id="nombre" th:field="*{nombre}" class="custom-input" placeholder="Ej: Cillian Murphy" required autofocus>
                </div>
                
                <div class="d-flex justify-content-center gap-3 mt-4">
                    <button type="submit" class="btn-modern m-0" style="width: auto; padding: 0.7rem 2.5rem;">Guardar</button>
                    <a th:href="@{/}" class="btn-modern m-0" style="width: auto; padding: 0.7rem 2.5rem; background-color: transparent; border: 1px solid #232326; color: #a1a1aa; text-decoration: none;">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
