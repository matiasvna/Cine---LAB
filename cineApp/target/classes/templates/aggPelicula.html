<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Nueva Película - CINEMAX</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" th:href="@{/css/aggPelicula.css}">
</head>
<body>
    <div class="form-container">
        <h2 class="form-title text-center mb-4">Nueva <span>Película</span></h2>
        
        <form th:action="@{/peliculas/guardar}" th:object="${pelicula}" method="post">
            
            <!-- Título -->
            <div class="mb-3">
                <label class="form-label">Título de la Película</label>
                <input type="text" th:field="*{titulo}" class="form-control custom-input" placeholder="Ej: Interstellar" required>
            </div>

            <!-- Año de Estreno (Dato tipo int) -->
            <div class="mb-3">
                <label class="form-label">Año de Estreno</label>
                <input type="number" th:field="*{año}" class="form-control custom-input" placeholder="Ej: 2024" required>
            </div>

            <!-- Director (Muchos a Uno) -->
            <div class="mb-3">
                <label class="form-label">Director</label>
                <select th:field="*{director}" class="form-select custom-input" required>
                    <option value="">-- Selecciona un Director --</option>
                    <option th:each="dir : ${directores}" th:value="${dir.id}" th:text="${dir.nombre}"></option>
                </select>
            </div>

            <!-- Actores (Muchos a Muchos - Selección Múltiple) -->
            <div class="mb-3">
                <label class="form-label">Actores</label>
                <select th:field="*{actores}" class="form-select custom-input" multiple required style="height: 100px;">
                    <option th:each="act : ${actores}" th:value="${act.id}" th:text="${act.nombre}"></option>
                </select>
                <small style="color: #a1a1aa; font-size: 0.8rem;">Mantén presionado Ctrl (o Cmd) para seleccionar varios actores al mismo tiempo.</small>
            </div>

            <!-- Género (Muchos a Uno) -->
            <div class="mb-4">
                <label class="form-label">Género</label>
                <select th:field="*{genero}" class="form-select custom-input" required>
                    <option value="">-- Selecciona un Género --</option>
                    <option th:each="gen : ${generos}" th:value="${gen.id}" th:text="${gen.titulo}"></option>
                </select>
            </div>

            <!-- Botones -->
            <div class="d-flex gap-3">
                <button type="submit" class="btn btn-save w-50">Guardar Película</button>
                <a th:href="@{/peliculas}" class="btn btn-cancel w-50 text-center">Cancelar</a>
            </div>
            
        </form>
    </div>
</body>
</html>
