<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control - CINEMAX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/index.css}">
</head>
<body>

    <nav class="custom-navbar">
        <a class="navbar-brand-modern" th:href="@{/}">
            CINE<span>MAX</span>
        </a>
        
        <div sec:authorize="isAuthenticated()" class="session-info">
            <span class="user-status">
                Conectado como <span sec:authentication="name" class="user-name"></span>
            </span>
            
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="btn-logout-modern">Cerrar Sesión</button>
            </form>
        </div>
    </nav>

    <main class="hero-container">
        <div class="hero-card">
            <h1 class="hero-title">Gestión de Catálogo</h1>
            <p class="hero-text">
                Bienvenido al panel. Desde acá se puede explorar, agregar y modificar 
                películas, organizar directores y mantener actualizado el catalogo.
            </p>
            
            <div class="button-group-modern d-flex justify-content-center align-items-center gap-3">
                
                <a th:href="@{/peliculas}" class="btn-primary-modern text-decoration-none">Ver Inventario Completo</a>
                
<div class="dropdown m-0 p-0">
                    <button class="btn-secondary-modern dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        + Agregar
                    </button>
                    <ul class="dropdown-menu custom-dropdown-menu shadow-lg">
                        <li><a class="dropdown-item" th:href="@{/peliculas/new}">Película</a></li>
                        <li><a class="dropdown-item" th:href="@{/actores/new}">Actor</a></li>
                        <li><a class="dropdown-item" th:href="@{/directores/new}">Director</a></li>
                        <li><a class="dropdown-item" th:href="@{/generos/new}">Género</a></li>
                    </ul>
                </div>

            </div>
        </div>
    </main>

    <footer class="custom-footer">
        <p>Hecho por <a href="https://github.com/matiasvna" target="_blank" class="footer-link">Matias Viña - b1gpp</a></p>
    </footer>
<script>
        document.addEventListener("DOMContentLoaded", function() {
            // Capturamos el botón y el menú
            const botonAgregar = document.querySelector('.dropdown-toggle');
            const menuDesplegable = document.querySelector('.custom-dropdown-menu');
            
            if(botonAgregar && menuDesplegable) {
                // Evento al hacer clic en el botón "+ Agregar"
                botonAgregar.addEventListener('click', function(e) {
                    e.preventDefault(); // Evita que la página salte
                    e.stopPropagation(); // Evita que el clic se propague al documento
                    
                    // Alterna la clase 'show' para abrir/cerrar
                    menuDesplegable.classList.toggle('show');
                    botonAgregar.classList.toggle('show');
                });

                // Evento para CERRAR el menú si el usuario hace clic afuera de la caja
                document.addEventListener('click', function(e) {
                    if (!botonAgregar.contains(e.target) && !menuDesplegable.contains(e.target)) {
                        menuDesplegable.classList.remove('show');
                        botonAgregar.classList.remove('show');
                    }
                });
            }
        });
    </script>
</body>
</html>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-rQOeQ4n29XK8TB6qONtHqD4KnXneHRg70Umhw5EpEupP8GaG2G+25hxPbS5ETPl3" crossorigin="anonymous"></script>
</body>
</html>
